# Razorpay/PayU call webhooks with no Supabase JWT; the functions verify the
# provider signature themselves. Without this the gateway 401s every webhook,
# so paid users never get upgraded when the browser-side verify step fails.
[functions.razorpay-webhook]
verify_jwt = false

[functions.payu-webhook]
verify_jwt = false

